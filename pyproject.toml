[project]
name = "figpi"
version = "0.1.0"
description = "A thin AI agent for the Raspberry Pi 5 that thinks on an Ollama server in your LAN"
requires-python = ">=3.11"
dependencies = []          # stdlib only, on purpose: it runs on the stock Raspberry Pi OS python

[project.scripts]
figpi = "figpi.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
